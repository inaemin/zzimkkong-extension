      <line class="wall" x1="1141" y1="290" x2="1346" y2="290"/>
      <line class="wall" x1="1382" y1="290" x2="1482" y2="290"/>
      <line class="wall" x1="1482" y1="29" x2="1482" y2="310"/>
    </g>

    <g id="entry">
      <path class="wall" d="M720 369 H1002 M1119 369 H1423 V610 H1119"/>
      <path class="wall" d="M720 369 V610 H1002"/>
    </g>

    <g id="right-side-rooms">
      <line class="wall" x1="1482" y1="348" x2="1702" y2="348"/>
      <line class="wall" x1="1482" y1="348" x2="1482" y2="371"/>
      <line class="wall" x1="1482" y1="429" x2="1482" y2="570"/>
      <line class="wall" x1="1482" y1="628" x2="1702" y2="628"/>
