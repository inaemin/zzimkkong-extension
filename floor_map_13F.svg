<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1474" height="933" viewBox="234 23 1474 933" role="img" aria-labelledby="title desc">
  <title id="title">13F floor map</title>
  <desc id="desc">Editable SVG recreation of the uploaded 13th-floor Korean floor plan.</desc>
  <style>
    .background { fill: #ffffff; }
    .wall {
      fill: none;
      stroke: #545454;
      stroke-width: 5;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .wall-thin {
      fill: none;
      stroke: #666666;
      stroke-width: 4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .soft-divider {
      fill: none;
      stroke: #c3c4c9;
      stroke-width: 4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .label {
      fill: #171717;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "NanumSquare", sans-serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .pod-label {
      fill: #111111;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "NanumSquare", sans-serif;
      font-size: 31px;
      font-weight: 700;
      letter-spacing: 0;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>

  <rect class="background" x="0" y="0" width="1726" height="972"/>

  <g id="walls">
    <g id="exterior">
      <path class="wall" d="M240 29 H1702 V950 H240 Z"/>
    </g>

    <g id="library">
      <line class="soft-divider" x1="1042" y1="30" x2="1042" y2="310"/>
      <line class="soft-divider" x1="240" y1="310" x2="1042" y2="310"/>
      <line class="soft-divider" x1="242" y1="31" x2="1040" y2="309"/>
      <line class="soft-divider" x1="1040" y1="31" x2="242" y2="309"/>
    </g>

    <g id="startup-lab">
      <line class="soft-divider" x1="561" y1="310" x2="561" y2="950"/>
    </g>

    <g id="andromeda-room">
