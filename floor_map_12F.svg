<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1471" height="934" viewBox="225 19 1471 934" role="img" aria-labelledby="title desc">
  <title id="title">12F floor map</title>
  <desc id="desc">Editable SVG recreation of the uploaded 12th-floor Korean floor plan.</desc>
  <style>
    .background { fill: #ffffff; }
    .wall {
      fill: none;
      stroke: #545454;
      stroke-width: 5;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .wall-thin {
      fill: none;
      stroke: #666666;
      stroke-width: 4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .soft-divider {
      fill: none;
      stroke: #c3c4c9;
      stroke-width: 4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .label {
      fill: #171717;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "NanumSquare", sans-serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .pod-label {
      fill: #111111;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "NanumSquare", sans-serif;
      font-size: 31px;
      font-weight: 700;
      letter-spacing: 0;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>

  <rect class="background" x="0" y="0" width="1714" height="970"/>

